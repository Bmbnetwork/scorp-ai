display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
expose_php = Off

memory_limit = 128M
max_execution_time = 60
post_max_size = 2M
upload_max_filesize = 2M

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1